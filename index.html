async function boot(){const r=await sb.auth.getUser();user=r.data.user;if(!user){const t=await sb.from("teams").select("id,name").order("name");if(!t.error)teams=t.data||[];actions.innerHTML="";document.getElementById("scoreboard").innerHTML='<p>Logg inn for å se poengene.</p>';authView();return}actions.innerHTML='<span class="pill">'+esc(user.user_metadata?.display_name||user.email||"Innlogget")+'</span><button id="logout" class="secondary">Logg ut</button>';document.getElementById("logout").onclick=async()=>{if(user?.is_anonymous&&!confirm("Dette er lagets eneste innloggede mobil. Hvis du logger ut, kan du miste tilgang til laget og tidligere innsendinger. Er du sikker?"))return;await sb.auth.signOut();await boot()};await scoreboard();const a=await sb.from("admins").select("user_id").eq("user_id",user.id).maybeSingle();if(a.error)throw a.error;isAdmin=!!a.data;const m=await sb.from("team_members").select("team_id").eq("user_id",user.id).maybeSingle();if(m.error)throw m.error;team=m.data?.team_id||null;if(isAdmin)await adminView();else if(team)await teamView();else joinView()}
async function loadMedia(rows){const ids=new Set(rows.map(r=>r.id));const result=await query("media");media=result.filter(m=>(m.submission_id&&ids.has(m.submission_id))||(m.message_id&&ids.has(m.message_id)));const signed=await Promise.all(media.map(async m=>{const r=await sb.storage.from("rebus-bevis").createSignedUrl(m.storage_path,3600);return {...m,url:r.data?.signedUrl||null}}));media=signed}

function validateFiles(files){for(const f of files){if(f.size>50*1024*1024)throw new Error("Filen «"+f.name+"» er større enn 50 MB. Velg en kortere video.");if(!/^(image\/(jpeg|png|webp)|video\/(mp4|quicktime|webm))$/.test(f.type))throw new Error("Filen «"+f.name+"» har et format som ikke støttes. Bruk JPG, PNG, WebP, MP4, MOV eller WebM.");}}
async function uploadFiles(files,teamId,parentId,kind){let errors=[];for(const f of files){try{if(f.size>50*1024*1024)throw new Error("Filen er større enn 50 MB");if(!/^(image\/(jpeg|png|webp)|video\/(mp4|quicktime|webm))$/.test(f.type))throw new Error("Ustøttet filtype");const ext=(f.name.split(".").pop()||"bin").replace(/[^a-z0-9]/gi,"").toLowerCase();const path=teamId+"/"+parentId+"/"+crypto.randomUUID()+"."+ext;const up=await sb.storage.from("rebus-bevis").upload(path,f,{contentType:f.type,upsert:false});if(up.error)throw up.error;const record={team_id:teamId,storage_path:path,mime_type:f.type};record[kind]=parentId;const db=await sb.from("media").insert(record);if(db.error)throw db.error}catch(e){errors.push(f.name+": "+(e.message||e))}}if(errors.length)note("Innholdet ble lagret, men disse vedleggene feilet: "+errors.join("; "));return errors.length}
async function teamView(){const t=teams.find(x=>x.id===team);if(!t){app.innerHTML=box("Lag mangler","<p>Kunne ikke finne laget ditt.</p>");return}const [ts,ss,ks,ms]=await Promise.all([query("tasks"),query("submissions"),query("skip_requests"),query("messages")]);tasks=ts.filter(x=>x.stage===t.current_stage).sort((a,b)=>a.position-b.position);subs=ss.filter(x=>x.team_id===team);skips=ks.filter(x=>x.team_id===team);messages=ms.filter(x=>x.team_id===team).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));await loadMedia([...subs,...messages]);const taskCards=tasks.map(taskCard).join("")||'<p>Ingen oppgaver lagt inn for denne delen ennå.</p>';app.innerHTML=box(esc(t.name)+" · Del "+t.current_stage,'<div class="row"><span class="pill gold">'+t.score+' poeng</span><span class="pill">To godkjente hovedoppgaver kreves før HK kan åpne neste del</span></div><p class="alert">Viktig: Bruk samme mobil hele rebusen. Ikke logg ut eller slett nettleserdata – da kan lagtilgangen gå tapt.</p><p>Bonusoppgaver er frivillige. Hopp over krever HK-godkjenning. Hvis poeng eller godkjenning ikke vises med en gang, oppdater nettsiden. Ikke logg ut.</p>'+taskCards)+box("Privat lagchat",chatHtml());bindTasks();bindChat()}
function taskCard(t){const mine=subs.filter(s=>s.task_id===t.id).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));const approved=mine.find(s=>s.status==="approved"),last=mine[0],sk=skips.find(s=>s.task_id===t.id&&s.status==="pending"),skipped=skips.find(s=>s.task_id===t.id&&s.status==="approved");const awaiting=mine.some(s=>s.status==="pending");const status=approved?'<span class="pill ok">Godkjent · '+approved.awarded_points+' p</span>':skipped?'<span class="pill ok">Hoppet over med HK-godkjenning</span>':last?'<span class="pill warn">'+esc(last.status==="pending"?"Venter på HK":"Avvist · prøv igjen")+'</span>':'<span class="pill">Ikke levert</span>';return '<div class="task '+(approved?"approved":"")+'"><div class="row"><h3>'+esc(t.title)+'</h3><span class="pill '+(t.bonus?"gold":"")+'">'+t.points+' p '+(t.bonus?"BONUS":"")+'</span></div><div class="row">'+status+'</div>'+(last&&last.note?'<p class="small">'+esc(last.note)+'</p>':'')+(last?mediaHtml(last.id,"submission_id"):'')+(awaiting&&!approved&&!skipped?'<form class="retry-proof-form" data-submission="'+esc(mine.find(s=>s.status==="pending").id)+'"><label>Legg til flere eller manglende bevis<input type="file" name="files" accept="image/*,video/*,.mov,.mp4,.m4v,.webm" multiple required></label><button type="submit" class="secondary">Last opp bevis til ventende innsending</button></form>':'')+(!approved&&!skipped&&!awaiting?'<form class="task-form" data-id="'+esc(t.id)+'"><label>Kommentar til HK<textarea name="note" placeholder="Hva har dere gjort?"></textarea></label><label>Bilde / video som bevis<input type="file" name="files" accept="image/*,video/*,.mov,.mp4,.m4v,.webm" multiple required></label><div class="top-actions"><button type="submit">Send til godkjenning</button><button type="button" class="secondary skip-btn" data-id="'+esc(t.id)+'" '+(sk?'disabled':'')+'>'+(sk?"Hopp over: venter":"Be om å hoppe over")+'</button></div></form>':'')+'</div>'}
function bindTasks(){document.querySelectorAll(".retry-proof-form").forEach(form=>form.onsubmit=async e=>{e.preventDefault();const btn=form.querySelector("button[type=submit]");const files=Array.from(form.elements.files.files);if(!files.length){note("Velg minst ett bilde eller en video.");return}try{validateFiles(files)}catch(e){err(e);return}btn.disabled=true;try{const check=await sb.from("submissions").select("status,team_id").eq("id",form.dataset.submission).single();if(check.error)throw check.error;if(check.data.team_id!==team||check.data.status!=="pending")throw new Error("Innsendingen venter ikke lenger på HK. Oppdater siden.");const failed=await uploadFiles(files,team,form.dataset.submission,"submission_id");if(!failed)note("Bevis lagt til på eksisterende innsending.",true);await teamView()}catch(e){err(e)}finally{btn.disabled=false}});document.querySelectorAll(".task-form").forEach(form=>form.onsubmit=async e=>{e.preventDefault();const btn=form.querySelector("button[type=submit]");const files=Array.from(form.elements.files.files);if(!files.length){note("Velg et bilde eller en video som bevis.");return}try{validateFiles(files)}catch(e){err(e);return}btn.disabled=true;try{const r=await sb.from("submissions").insert({team_id:team,task_id:form.dataset.id,user_id:user.id,note:form.elements.note.value,status:"pending",awarded_points:0}).select("id").single();if(r.error)throw r.error;const failed=await uploadFiles(files,team,r.data.id,"submission_id");if(!failed)note("Oppgaven er sendt til HK!",true);await teamView()}catch(e){err(e)}finally{btn.disabled=false}});document.querySelectorAll(".skip-btn").forEach(btn=>btn.onclick=async()=>{btn.disabled=true;try{const r=await sb.from("skip_requests").insert({team_id:team,task_id:btn.dataset.id,user_id:user.id,status:"pending"});if(r.error)throw r.error;note("Forespørselen er sendt til HK.",true);await teamView()}catch(e){err(e);btn.disabled=false}})}

function bindChat(){document.getElementById("chat-form").onsubmit=async e=>{e.preventDefault();const f=e.target,submit=f.querySelector('button[type="submit"]');if(submit.disabled)return;submit.disabled=true;try{if(!f.elements.content.value.trim()&&!f.elements.files.files.length)throw new Error("Skriv en melding eller velg en fil");validateFiles(Array.from(f.elements.files.files));const r=await sb.from("messages").insert({team_id:team,task_id:f.elements.task.value||null,sender_id:user.id,content:f.elements.content.value.trim()}).select("id").single();if(r.error)throw r.error;const failed=await uploadFiles(Array.from(f.elements.files.files),team,r.data.id,"message_id");if(!failed)note("Melding sendt.",true);await teamView()}catch(e){err(e)}finally{submit.disabled=false}}}
async function adminView(){const [ts,ss,ks,ms]=await Promise.all([query("tasks"),query("submissions"),query("skip_requests"),query("messages")]);tasks=ts;subs=ss;skips=ks;messages=ms;await loadMedia([...subs,...messages]);const pending=subs.filter(s=>s.status==="pending").sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));const skipPending=skips.filter(s=>s.status==="pending");let body='<div class="row"><span class="pill gold">HK / Administrator</span><button id="admin-refresh" class="secondary">Oppdater</button></div><p>Godkjenn bevis før poeng gis. Poengtavlen regnes automatisk. Hvert lag må få to hovedoppgaver godkjent før neste del kan åpnes.</p>';body+='<h3>Innsendinger som venter ('+pending.length+')</h3>';body+=pending.map(s=>{const t=tasks.find(x=>x.id===s.task_id),tm=teams.find(x=>x.id===s.team_id),hasProof=media.some(m=>m.submission_id===s.id&&m.url);return '<div class="task"><div class="row"><b>'+esc(tm?.name||"Lag")+'</b><span class="pill">'+esc(t?.title||"Oppgave")+'</span></div><p>'+esc(s.note||"Ingen kommentar")+'</p>'+mediaHtml(s.id,"submission_id")+(hasProof?'':'<p class="alert">Bilde- eller videobevis mangler eller kan ikke åpnes. Be laget legge til bevis før godkjenning.</p>')+'<form class="review-form stack" data-id="'+esc(s.id)+'"><label>Poeng<input type="number" name="points" min="0" max="10000" value="'+(t?.points||0)+'" required></label><label>Kommentar<textarea name="note" placeholder="Kommentar til laget"></textarea></label><div class="top-actions"><button type="submit" '+(hasProof?'':'disabled title="Mangler tilgjengelig bevis"')+'>Godkjenn</button><button type="button" class="danger reject-btn">Avvis</button></div></form></div>'}).join("")||'<p>Ingen innsendinger venter.</p>';body+='<h3>Hopp over-forespørsler ('+skipPending.length+')</h3>'+skipPending.map(s=>{const t=tasks.find(x=>x.id===s.task_id),tm=teams.find(x=>x.id===s.team_id);return '<div class="task"><b>'+esc(tm?.name||"Lag")+'</b> · '+esc(t?.title||"Oppgave")+'<div class="top-actions" style="margin-top:10px"><button class="skip-review" data-id="'+esc(s.id)+'" data-status="approved">Tillat å hoppe over</button><button class="skip-review danger" data-id="'+esc(s.id)+'" data-status="rejected">Avslå</button></div></div>'}).join("")+'<h3>Åpne neste del</h3>'+teams.map(tm=>{const n=tm.current_stage,approved=new Set(subs.filter(s=>s.team_id===tm.id&&s.status==="approved"&&tasks.some(t=>t.id===s.task_id&&t.stage===n&&!t.bonus)).map(s=>s.task_id)).size;return '<div class="task row"><div><b>'+esc(tm.name)+'</b><div class="muted small">Del '+n+' · '+approved+' hovedoppgaver godkjent</div></div><button class="unlock-btn" data-team="'+esc(tm.id)+'" data-stage="'+(n+1)+'" '+(n>=5||approved<2?'disabled':'')+'>Åpne del '+(n+1)+'</button></div>'}).join("");body+='<h3>Private lagmeldinger</h3>'+teams.map(tm=>'<div class="task"><h3>'+esc(tm.name)+'</h3><div style="max-height:320px;overflow:auto">'+messages.filter(m=>m.team_id===tm.id).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).slice(-20).map(m=>'<div class="message"><div class="muted small">'+time(m.created_at)+' · '+(m.sender_id===user.id?'HK':short(m.sender_id))+'</div>'+esc(m.content)+mediaHtml(m.id,"message_id")+'</div>').join("")+'</div><form class="admin-chat-form stack" data-team="'+esc(tm.id)+'"><label>Svar til laget<textarea name="content" placeholder="Skriv melding"></textarea></label><label>Legg ved bilde / video<input type="file" name="files" multiple accept="image/*,video/*,.mov,.mp4,.m4v,.webm"></label><button type="submit">Send til '+esc(tm.name)+'</button></form></div>').join("");app.innerHTML=box("Kontrollrom",body);document.getElementById("admin-refresh").onclick=async()=>{await scoreboard();await adminView()};document.querySelectorAll(".admin-chat-form").forEach(f=>f.onsubmit=async e=>{e.preventDefault();const submit=f.querySelector('button[type="submit"]');if(submit.disabled)return;submit.disabled=true;try{const content=f.elements.content.value.trim();const files=Array.from(f.elements.files.files);if(!content&&!files.length)throw new Error("Skriv en melding eller velg en fil");validateFiles(files);const r=await sb.from("messages").insert({team_id:f.dataset.team,sender_id:user.id,content}).select("id").single();if(r.error)throw r.error;const failed=await uploadFiles(files,f.dataset.team,r.data.id,"message_id");if(!failed)note("Melding sendt til laget.",true);await adminView()}catch(e){err(e)}finally{submit.disabled=false}});document.querySelectorAll(".review-form").forEach(f=>{f.onsubmit=async e=>{e.preventDefault();await review(f.dataset.id,"approved",Number(f.elements.points.value),f.elements.note.value)};f.querySelector(".reject-btn").onclick=async()=>{await review(f.dataset.id,"rejected",0,f.elements.note.value)}});document.querySelectorAll(".skip-review").forEach(b=>b.onclick=async()=>{try{const r=await sb.from("skip_requests").update({status:b.dataset.status,reviewer_note:"Behandlet av HK",reviewed_by:user.id,reviewed_at:new Date().toISOString()}).eq("id",b.dataset.id).eq("status","pending").select("id");if(r.error)throw r.error;if(!r.data?.length)throw new Error("Forespørselen er allerede behandlet. Oppdater kontrollrommet.");note("Forespørselen er behandlet.",true);await adminView()}catch(e){err(e)}});document.querySelectorAll(".unlock-btn").forEach(b=>b.onclick=async()=>{try{const r=await sb.from("stage_unlocks").insert({team_id:b.dataset.team,stage:Number(b.dataset.stage)});if(r.error)throw r.error;note("Neste del er åpnet for laget!",true);await scoreboard();await adminView()}catch(e){err(e)}})}
async function review(id,status,points,reviewerNote){try{if(status==="approved"){const proof=await sb.from("media").select("id").eq("submission_id",id).limit(1);if(proof.error)throw proof.error;if(!proof.data?.length)throw new Error("Kan ikke godkjenne uten bilde eller video. Be laget laste opp bevis først.");}const r=await sb.from("submissions").update({status,awarded_points:points,reviewer_note:reviewerNote,reviewed_by:user.id,reviewed_at:new Date().toISOString()}).eq("id",id).eq("status","pending").select("id");if(r.error)throw r.error;if(!r.data?.length)throw new Error("Innsendingen er allerede behandlet. Oppdater kontrollrommet.");note("Innsendingen er "+(status==="approved"?"godkjent":"avvist")+".",true);await scoreboard();await adminView()}catch(e){err(e)}}
sb.auth.onAuthStateChange((event)=>{if(event==="SIGNED_OUT")setTimeout(boot,0)});
const messageChanged=(latest,known)=>(latest?.[0]?.id||null)!==(known?.length?known[known.length-1].id:null);
let stageRefreshBusy=false;setInterval(async()=>{if(!user||stageRefreshBusy||document.hidden)return;stageRefreshBusy=true;const previousStage=team?teams.find(t=>t.id===team)?.current_stage:null;try{await scoreboard();const nextStage=team?teams.find(t=>t.id===team)?.current_stage:null;if(team&&previousStage!=null&&nextStage!=null&&previousStage!==nextStage){await teamView()}else if(team&&!isAdmin&&!document.activeElement?.closest("form")){const recent=await sb.from("messages").select("id").eq("team_id",team).order("created_at",{ascending:false}).limit(1);if(recent.error)throw recent.error;if(messageChanged(recent.data,messages)){await teamView()}else{const pendingSubIds=subs.filter(s=>s.status==="pending").map(s=>s.id);const pendingSkipIds=skips.filter(s=>s.status==="pending").map(s=>s.id);if(pendingSubIds.length||pendingSkipIds.length){const [subCheck,skipCheck]=await Promise.all([pendingSubIds.length?sb.from("submissions").select("id,status").eq("team_id",team).in("id",pendingSubIds):Promise.resolve(null),pendingSkipIds.length?sb.from("skip_requests").select("id,status").eq("team_id",team).in("id",pendingSkipIds):Promise.resolve(null)]);if(subCheck?.error)throw subCheck.error;if(skipCheck?.error)throw skipCheck.error;if((subCheck&&(subCheck.data.length!==pendingSubIds.length||subCheck.data.some(s=>s.status!=="pending")))||(skipCheck&&(skipCheck.data.length!==pendingSkipIds.length||skipCheck.data.some(s=>s.status!=="pending"))))await teamView()}}}}catch(e){console.error('Automatisk oppdatering feilet',e)}finally{stageRefreshBusy=false}},20000);
boot().catch(err);
</script></body></html>
