# GitHub Pages is already deploying from the repository's configured Pages source.
# This workflow validates the app without launching a competing Pages deployment.
# A second deploy-pages job can fail when the built-in Pages deployment is in progress.
name: Valider Apokalypserebusen

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Hent kildekode
        uses: actions/checkout@v4
      - name: Kontroller statisk app
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -q 'Apokalypserebusen' index.html
          if grep -Eqi 'service_role|sb_secret_' index.html; then
            echo 'Mulig hemmelig nøkkel i offentlig app. Avbryter.'
            exit 1
          fi
          sed -n '/<script type="module">/,/<\/script>/p' index.html | sed '1d;$d' > /tmp/rebus-app.mjs
          test -s /tmp/rebus-app.mjs
          node --check /tmp/rebus-app.mjs
